<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prime Keys - Kayview</title>
<style>
body{font-family:Arial;background:#0a0a0a;color:#fff;padding:20px}
input,select{width:100%;padding:12px;margin:8px 0;background:#222;color:#fff;border:1px solid #444;border-radius:8px}
button{width:100%;padding:14px;background:#f5c518;color:#000;font-weight:bold;border:none;border-radius:8px;font-size:16px}
.card{background:#1a1a1a;padding:15px;margin:10px 0;border-radius:10px;border:1px solid #333}
.key{font-size:22px;color:#f5c518;font-weight:bold;letter-spacing:1px}
</style>
</head>
<body>
<h2>🔑 Prime Keys - Kayview</h2>

<input id="username" placeholder="Username - e.g. Thabo">
<input id="email" placeholder="Email">
<select id="days"><option value="30">30 Days</option><option value="90">90 Days</option><option value="365">365 Days</option></select>
<input id="bot" placeholder="Bot Name - e.g. SlowMo Bizz" value="SlowMo Bizz">
<button onclick="gen()">GENERATE KEY</button>
<div id="result"></div>
<h3>All Keys</h3>
<div id="list"></div>

<script>
const API = "https://kayview-api.onrender.com";
async function gen(){
  const body = { username: document.getElementById('username').value, email: document.getElementById('email').value, duration_days: Number(document.getElementById('days').value), bot_name: document.getElementById('bot').value };
  const r = await fetch(API + "/prime/keys/generate", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
  const d = await r.json();
  document.getElementById('result').innerHTML = `<div class="card"><div>New Key for <b>${d.username}</b></div><div class="key">${d.code}</div><div>Expires: ${d.expires}</div><div>Copy this and send to customer</div></div>`;
  load();
}
async function load(){
  const r = await fetch(API + "/prime/keys");
  const keys = await r.json();
  document.getElementById('list').innerHTML = keys.map(k=>`<div class="card"><div class="key">${k.code}</div><div>${k.username} - ${k.email}</div><div>${k.bot_name} | ${k.status} | Exp: ${k.expires}</div><button onclick="toggle('${k.id}','${k.status}')" style="background:${k.status=='INACTIVE'?'green':'red'};color:white;margin-top:8px">${k.status=='INACTIVE'?'ACTIVATE':'DEACTIVATE'}</button></div>`).join('') || "No keys yet";
}
async function toggle(id,status){
  const newStatus = status=='INACTIVE' ? 'ACTIVE' : 'INACTIVE';
  await fetch(API + "/prime/keys/toggle", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({id, status:newStatus})});
  load();
}
load();
</script>
</body>
</html>
